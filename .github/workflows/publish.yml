# Build and publish the container image to GitHub's registry on every push to
# main, so deployments update the way any other self-hosted app does: Portainer
# pulls a new image, rather than anyone maintaining a checkout on the NAS.
name: Publish image

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "todo.md"
  workflow_dispatch:        # so you can publish without pushing a commit

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # the only write this workflow needs

    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated here. The app is pure Python with nothing to compile,
      # so this costs seconds rather than the usual cross-build penalty.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
