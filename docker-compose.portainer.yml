# Shortform Audio Bookshelf — no-build variant.
#
# Use docker-compose.yml instead if you can: a Portainer Repository stack
# pointed at the GitHub repo builds itself and updates on redeploy.
#
# This file is the fallback for when building on the NAS is not an option —
# it runs the stock python image with the source mounted in. The app is pure
# Python standard library, so nothing needs compiling.
#
#   1. Put the source on the NAS, e.g. /volume1/docker/sab/app
#        git clone https://github.com/cryptoskillz/shortformaudiobookshelf.git \
#          /volume1/docker/sab/app
#   2. Paste this into Portainer's stack editor.
#   3. Set the environment variables below in Portainer.
#
# Updating later is `git pull` in that folder, then restart the stack.

services:
  shortform-audio-bookshelf:
    image: python:3.13-alpine
    container_name: shortform-audio-bookshelf
    restart: unless-stopped
    working_dir: /app
    command: python3 server.py

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${HOST_PORT:-7345}:7345"

    volumes:
      # The source, read-only — the container never writes here.
      - ${APP_PATH:-/volume1/docker/sab/app}:/app:ro
      - ${LIBRARY_PATH:-/volume1/media/audiobooks-incoming}:/library
      - ${MEDIA_PATH:-/volume1/media/audiobooks}:/media
      - ${CONFIG_PATH:-/volume1/docker/sab/config}:/config

    environment:
      - SHORTLIST_LIBRARY=/library
      - SHORTLIST_OUTPUT=/media
      - SHORTLIST_STATE_DIR=/config
      - SHORTLIST_HOST=0.0.0.0
      - SHORTLIST_PORT=7345
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Europe/London}

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7345/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
