# Shortform Audio Bookshelf — paste-into-Portainer stack.
#
# This pulls a prebuilt image from GitHub's registry, so it behaves like any
# other self-hosted app: "Re-pull image and redeploy" in Portainer fetches the
# new version. Nothing to clone, nothing to build, nothing to keep up to date
# on the NAS by hand.
#
# Paste this into Portainer's stack editor and set the variables below.

services:
  shortform-audio-bookshelf:
    image: ghcr.io/cryptoskillz/shortformaudiobookshelf:latest
    container_name: shortform-audio-bookshelf
    restart: unless-stopped

    # Match the user that owns your media, or uploads and Organise will fail
    # with permission errors: `id -u` and `id -g` on the NAS.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${HOST_PORT:-7345}:7345"

    volumes:
      # THE LIBRARY — what gets served and played.
      - ${LIBRARY_PATH:-/volume1/docker/media/audiobooks-shortform}:/library
      # DOWNLOADS — where new files land. Import takes them out of here and
      # files them into the library. Nothing is ever played from here.
      - ${IMPORT_PATH:-/volume1/docker/media/downloads/audiobooks-incoming}:/incoming
      # OPTIONAL — a tidy copy for other tools such as Audiobookshelf. Most
      # setups do not need it: Import already files books into the library.
      # Uncomment and point it somewhere if you do.
      # - /volume1/docker/media/audiobooks-export:/export
      # STATE — index, covers, accounts, resume positions. Back this one up.
      - ${CONFIG_PATH:-/volume1/docker/shortform-audio/config}:/config

    environment:
      - TZ=${TZ:-Europe/London}

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7345/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
