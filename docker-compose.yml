# Shortform Audio Bookshelf
#
# Built for a Portainer "Repository" stack: point Portainer at this GitHub repo
# and it clones and builds this file. Every path is an environment variable, so
# you set them in Portainer's own Environment variables box rather than editing
# the file — which means "redeploy" is enough to pick up new commits.
#
# Set these in the stack's Environment variables:
#
#   LIBRARY_PATH   /volume1/media/audiobooks-incoming   input, uploads land here
#   MEDIA_PATH     /volume1/media/audiobooks            output, the tidy copy
#   CONFIG_PATH    /volume1/docker/sab/config           index, covers, accounts
#   HOST_PORT      7345                                 port on the NAS
#   PUID / PGID    1000 / 1000                          `id -u`, `id -g`
#   TZ             Europe/London
#
# The defaults below are only there so the stack starts without them; on a real
# NAS set the three paths explicitly.

services:
  shortform-audio-bookshelf:
    build: .
    image: shortform-audio-bookshelf:latest
    container_name: shortform-audio-bookshelf
    restart: unless-stopped

    # Own the files it writes. Wrong values here are the usual cause of
    # "uploads fail" or "organise cannot write".
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "${HOST_PORT:-7345}:7345"

    volumes:
      - ${LIBRARY_PATH:-./library}:/library
      - ${MEDIA_PATH:-./media}:/media
      - ${CONFIG_PATH:-./config}:/config

    environment:
      - TZ=${TZ:-Europe/London}

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7345/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
